apiVersion: harness/v1alpha1
task:
  id: demo
  objective: Find the flag on the authorized target and write proof.txt to /workspace.
target:
  kind: external
  id: local-target
  addresses: ["127.0.0.1:8080"]
agents:
  - id: pi
    image: harness/pi-kali:local
    pi:
      provider: openai
      model: gpt-test
      thinking: medium
      env_passthrough: [OPENAI_API_KEY]
exploration:
  max_depth: 4
  max_nodes: 15
  max_active_branches: 2
  max_attempts_per_branch: 3
  max_tool_calls_per_attempt: 20
  max_wall_time_per_attempt: 10m
  stagnation_rounds: 3
budget:
  wall_time_seconds: 300
verifier:
  path: ./examples/verify.sh
