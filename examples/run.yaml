apiVersion: harness/v2
task:
  id: demo
  objective: Find the flag on the authorized target and write proof.txt to /workspace.
target:
  kind: external
  id: local-target
  addresses: ["127.0.0.1:8080"]
  isolation: caller_managed
reasoner:
  id: planner
  image: harness/pi-kali:local
  env_from: [OPENCODE_API_KEY]
  runtime:
    provider: opencode-go
    model: deepseek-v4.1-flash
    thinking: medium
executors:
  - id: executor-1
    image: harness/pi-kali:local
    env_from: [OPENCODE_API_KEY]
    runtime:
      provider: opencode-go
      model: deepseek-v4.1-flash
      thinking: medium
  - id: executor-2
    image: harness/pi-kali:local
    env_from: [OPENCODE_API_KEY]
    runtime:
      provider: opencode-go
      model: deepseek-v4.1-flash
      thinking: medium
policy:
  max_open_intents: 2
  max_total_intents: 20
  max_attempts_per_intent: 3
  max_tool_calls_per_attempt: 30
  max_wall_time_per_attempt: 5m
  conclude_timeout: 90s
  stagnation_rounds: 2
  max_reasoner_tool_calls: 8
  max_reasoner_wall_time: 2m
  bootstrap_enabled: true
budget:
  wall_time_seconds: 300
secret_env: [OPENAI_API_KEY]
verifier:
  path: ./examples/verify.sh
