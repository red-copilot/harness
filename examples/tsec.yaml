# TSec lifecycle is composed in Go because Backend and Verifier are interfaces.
# This file is a serializable descriptor for one authorized challenge.
apiVersion: harness/v2
task:
  id: tsec-challenge
  objective: Solve the authorized TSec challenge and submit every remaining flag.
target:
  kind: tsec
  id: tsec-challenge
  isolation: caller_managed
  addresses: []
reasoner:
  id: planner
  image: harness/pi-kali:local
  env_from: [OPENCODE_API_KEY, HTTP_PROXY, HTTPS_PROXY, ALL_PROXY, NO_PROXY]
  runtime:
    provider: opencode-go
    model: deepseek-v4.1-flash
    thinking: high
executors:
  - id: executor-1
    image: harness/pi-kali:local
    env_from: [BENCHMARK_BASE_URL, BENCHMARK_TOKEN, OPENCODE_API_KEY, HTTP_PROXY, HTTPS_PROXY, ALL_PROXY, NO_PROXY]
    cap_add: [NET_RAW]
    runtime:
      provider: opencode-go
      model: deepseek-v4.1-flash
      thinking: high
  - id: executor-2
    image: harness/pi-kali:local
    env_from: [BENCHMARK_BASE_URL, BENCHMARK_TOKEN, OPENCODE_API_KEY, HTTP_PROXY, HTTPS_PROXY, ALL_PROXY, NO_PROXY]
    cap_add: [NET_RAW]
    runtime:
      provider: opencode-go
      model: deepseek-v4.1-flash
      thinking: high
secret_env: [BENCHMARK_TOKEN, OPENCODE_API_KEY]
policy:
  max_open_intents: 2
  max_total_intents: 20
  max_attempts_per_intent: 3
  max_tool_calls_per_attempt: 30
  max_wall_time_per_attempt: 5m
  conclude_timeout: 90s
  stagnation_rounds: 2
  max_reasoner_tool_calls: 8
  max_reasoner_wall_time: 2m
  bootstrap_enabled: true
budget:
  wall_time_seconds: 900
tsec:
  use_hint: false
  check_vpn: true
  base_url_env: BENCHMARK_BASE_URL
  token_env: BENCHMARK_TOKEN
