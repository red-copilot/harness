apiVersion: harness/v1alpha1
task:
  id: tsec
  objective: Solve the authorized TSec challenge and submit every remaining flag.
agents:
  - id: pi
    image: harness/pi-kali:local
    pi:
      provider: openai
      model: gpt-test
      thinking: high
      tools: [read, bash, edit, write]
      env_passthrough: [OPENAI_API_KEY]
    env_from: [BENCHMARK_BASE_URL, BENCHMARK_TOKEN]
budget:
  wall_time_seconds: 1800
tsec:
  all: true
  parallel: 3
  use_hint: false
  base_url_env: BENCHMARK_BASE_URL
  token_env: BENCHMARK_TOKEN
